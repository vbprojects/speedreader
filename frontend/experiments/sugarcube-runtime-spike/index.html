<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'self' blob:; child-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' ws://localhost:* http://localhost:* ws://127.0.0.1:* http://127.0.0.1:*" />
    <title>SugarCube Runtime Spike</title>
    <style>
      :root { font: 14px/1.45 system-ui, sans-serif; color: #172033; background: #f5f7fb; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; }
      header, section { max-width: 1100px; margin: 0 auto 16px; padding: 16px; background: white; border: 1px solid #d8deea; border-radius: 10px; }
      h1, h2 { margin: 0 0 12px; }
      h1 { font-size: 22px; }
      h2 { font-size: 16px; }
      .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      button, select { min-height: 34px; padding: 6px 10px; }
      button { cursor: pointer; }
      .status { margin-left: auto; font-weight: 650; }
      .status[data-state="ready"] { color: #08783e; }
      .status[data-state="error"] { color: #b42318; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto; }
      .grid section { width: 100%; margin: 0; }
      pre { margin: 0; padding: 12px; min-height: 90px; max-height: 320px; overflow: auto; background: #101828; color: #e4e7ec; border-radius: 7px; white-space: pre-wrap; word-break: break-word; }
      #actions { display: grid; gap: 8px; }
      .action { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid #e4e7ec; border-radius: 7px; }
      .action code { flex: 1; overflow-wrap: anywhere; }
      #runtime-frame[data-visible="false"] { position: fixed; left: -12000px; top: 0; width: 1024px; height: 768px; opacity: 0.01; pointer-events: none; }
      #runtime-frame[data-visible="true"] { display: block; width: min(100%, 1024px); height: 500px; margin: 16px auto; border: 2px solid #7f56d9; background: white; }
    </style>
  </head>
  <body>
    <header>
      <h1>SugarCube Runtime Host Spike</h1>
      <div class="controls">
        <label>Strategy
          <select id="strategy">
            <option value="url">Same-origin fixture URL</option>
            <option value="blob">Same-origin Blob URL</option>
            <option value="srcdoc">iframe srcdoc</option>
          </select>
        </label>
        <button id="load" type="button">Load runtime</button>
        <button id="teardown" type="button">Teardown</button>
        <button id="save" type="button">Save</button>
        <button id="restore" type="button">Destroy + restore</button>
        <button id="back" type="button">History back</button>
        <button id="forward" type="button">History forward</button>
        <button id="visibility" type="button">Show iframe</button>
        <button id="diagnostics" type="button">Refresh diagnostics</button>
        <button id="export" type="button">Export JSON</button>
        <span id="status" class="status" data-state="idle">Idle</span>
      </div>
    </header>

    <div class="grid">
      <section>
        <h2>Runtime</h2>
        <pre id="runtime">Not loaded.</pre>
      </section>
      <section>
        <h2>Projected passage text</h2>
        <pre id="projection">Not loaded.</pre>
      </section>
      <section>
        <h2>Live actions</h2>
        <div id="actions">Not loaded.</div>
      </section>
      <section>
        <h2>Event and mutation timeline</h2>
        <pre id="timeline">No events.</pre>
      </section>
    </div>

    <div id="frame-slot"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
